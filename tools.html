<script>window.addEventListener('load',()=>setTimeout(()=>document.getElementById('loader')?.classList.add('hide'),500));</script><nav><b>DARKSIDE</b><a href="/dashboard.html">Dashboard</a></nav><main class="container"><h1>Tools</h1><section class="panel"><h2>Cookies → JSON</h2><textarea id="i">[]</textarea><button onclick="go('/api/tools/cookies-to-json')">CONVERT</button><pre id="o"></pre></section><section class="panel"><h2>JSON → Cookies</h2><textarea id="j">{"cookies":[]}</textarea><button onclick="go('/api/tools/json-to-cookies',1)">CONVERT</button><pre id="q"></pre></section></main><footer class="dev-credit">DEVELOPED BY <strong>RISSsa</strong> · DARKSIDE SYSTEM</footer><script>async function go(u,j){try{let x=JSON.parse(j?i.value:j.value);if(j)x=x.cookies;let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookies:x})}),d=await r.json();(j?q:o).textContent=JSON.stringify(d,null,2)}catch(e){(j?q:o).textContent='Invalid JSON'}}</script></body></html>
