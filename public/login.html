<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DARKSIDE Login</title><link rel="stylesheet" href="/style.css"></head><body class="auth-page"><main class="auth-card"><div class="brand">DARKSIDE</div><p class="muted">Secure access terminal</p><form id="f"><label>Email</label><input id="e" type="email" required><label>Password</label><input id="p" type="password" required><button>ENTER</button><p id="m"></p></form></main><footer class="dev-credit">DEVELOPED BY <strong>RISSsa</strong> · DARKSIDE SYSTEM</footer><script>f.onsubmit=async x=>{x.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})}),d=await r.json();if(r.ok)location='/dashboard.html';else m.textContent=d.error}</script></body></html>
